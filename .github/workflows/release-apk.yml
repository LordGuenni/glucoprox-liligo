name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.1). If empty, uses latest git tag or v2.0'
        required: false
        default: ''
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x GlucoProxBLE/gradlew

      - name: Build Debug & Release APKs
        working-directory: GlucoProxBLE
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK release artifacts
        run: |
          mkdir -p release-assets

          # Determine version/tag name
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +'%Y.%m.%d')"
          fi

          echo "TAG_NAME=$TAG" >> $GITHUB_ENV

          # Copy and rename APKs
          cp GlucoProxBLE/app/build/outputs/apk/release/app-release.apk "release-assets/GlucoProxBLE-${TAG}.apk"
          cp GlucoProxBLE/app/build/outputs/apk/debug/app-debug.apk "release-assets/GlucoProxBLE-${TAG}-debug.apk"

          echo "Prepared APKs:"
          ls -la release-assets/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glucoprox-apks-${{ env.TAG_NAME }}
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: GlucoProxBLE ${{ env.TAG_NAME }}
          files: release-assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
